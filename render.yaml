services:
  - type: web
    name: ecmo-research-dashboard
    env: python
    plan: free
    healthCheckPath: /healthz
    # Scientific outputs are generated and reviewed before deployment. Render
    # only packages committed artifacts; it must not replace real GNINA results
    # with prototype scores during a production build.
    buildCommand: "python3 -m pip install --no-cache-dir rdkit==2025.9.6 && python3 build_dashboard_bundle.py && python3 build_track3_dashboard.py"
    startCommand: "python3 research_assistant_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: AI_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: AUTO_RESEARCH_ENABLED
        value: "0"
      - key: AUTO_RESEARCH_INTERVAL_SECONDS
        value: "3600"
      - key: AUTO_RESEARCH_LLM_ENABLED
        value: "0"
      - key: AUTO_RESEARCH_PAGE_SIZE
        value: "24"
      - key: GNINA_MODE
        value: disabled
      - key: GNINA_RUN_COUNT
        value: "5"
      - key: GNINA_CNN_SCORE_MIN
        value: "0.50"
      - key: GNINA_VERSION_LABEL
        value: track3-dashboard-read-only
      - key: ECMO_DASHBOARD_HOST
        value: "0.0.0.0"
      - key: ECMO_ALLOWED_ORIGINS
        value: "https://ecmo-research-dashboard.onrender.com"
      - key: ECMO_BASIC_AUTH_USER
        sync: false
      - key: ECMO_BASIC_AUTH_PASSWORD
        sync: false
      - key: ECMO_APP_LOGIN_USERS_JSON
        sync: false
      - key: ECMO_APP_LOGIN_USER
        sync: false
      - key: ECMO_APP_LOGIN_PASSWORD
        sync: false
      - key: ECMO_SESSION_SECRET
        sync: false
      - key: ECMO_SESSION_TTL_HOURS
        value: "24"
      - key: ECMO_DISCOVERY_RATE_LIMIT_COUNT
        value: "12"
      - key: ECMO_DISCOVERY_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: DEEPSEEK_API_KEY
        sync: false
